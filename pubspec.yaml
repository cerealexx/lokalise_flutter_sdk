name: lokalise_flutter_sdk
description: >- 
  Lokalise Flutter SDK over-the-air translations updates. 
  This package provides new translations from lokalise.com
  without a new app release.
version: 3.0.0
homepage: https://developers.lokalise.com/docs/flutter-sdk


environment:
  sdk: ^3.0.0
  flutter: '>=3.0.0'


dependencies:
  flutter:
    sdk: flutter
  dart_style: ^3.0.0
  intl: ^0.20.0
  intl_translation: ^0.21.0
  yaml: ^3.0.0
  path: ^1.0.0
  petitparser: ^7.0.0
  logger: ^2.0.0
  shared_preferences: ^2.0.0
  http: ^1.0.0
  archive: ^4.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  build_runner: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.0.0


executables:
  gen-lok-l10n:  


platforms:
  ios:
  android:
  macos:
  windows:   
  linux:
  web:
